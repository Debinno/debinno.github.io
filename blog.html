<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Debino</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <nav>
    <div class="logo">
      <img src="/assets/images/logo.png" alt="Debino Logo" class="logo-img">
      Debino
    </div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/projects">Projects</a>
      <a href="/blog" class="active">Blog</a>
      <a href="/about">About</a>
    </div>
  </nav>

  <div class="sidebar">
    <h2>Blog Posts</h2>
    <div class="doc-links">
      <!-- Content will be loaded dynamically -->
    </div>
  </div>

  <div class="main-content">
    <div class="doc-intro">
      <h1>Blog</h1>
      <p>Welcome to my blog! Here I share my thoughts and experiences on:</p>
      <ul>
        <li>Software Development</li>
        <li>Game Modding</li>
        <li>Content Creation</li>
        <li>Tech Reviews</li>
      </ul>
    </div>
    <div id="content" class="markdown-content">
      <!-- Skeleton loaders -->
      <div class="skeleton" style="height: 40px; width: 60%; margin-bottom: 20px;"></div>
      <div class="skeleton" style="height: 20px; width: 100%; margin-bottom: 10px;"></div>
      <div class="skeleton" style="height: 20px; width: 100%; margin-bottom: 10px;"></div>
      <div class="skeleton" style="height: 20px; width: 80%; margin-bottom: 30px;"></div>
    </div>
  </div>

  <footer>
    <div class="footer-bottom">
      <p>© 2024 Debino | Software Developer</p>
      <div class="social-links">
        <a href="https://github.com/Debinno" target="_blank">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://x.com/xexdebino" target="_blank">
          <i class="fab fa-x-twitter"></i>
        </a>
        <a href="https://www.youtube.com/@Debino_" target="_blank">
          <i class="fab fa-youtube"></i>
        </a>
      </div>
    </div>
  </footer>

  <script src="/scripts/content-loader.js"></script>
  <div class="progress-bar"></div>
  <script src="/scripts/progress.js"></script>
</body>
</html>
